<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090c17">
  <title>霓虹蛇域 · Neon Snake</title>
  <style>
    :root {
      --bg: #080b14;
      --panel: rgba(19, 23, 38, .76);
      --panel-solid: #121625;
      --line: rgba(255, 255, 255, .09);
      --muted: #7d8499;
      --text: #f5f7ff;
      --lime: #c8ff3d;
      --lime-soft: rgba(200, 255, 61, .16);
      --purple: #a56cff;
      --coral: #ff6d75;
      --cyan: #6be6ff;
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(165, 108, 255, .12), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(200, 255, 61, .08), transparent 30%),
        var(--bg);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      z-index: 10;
    }

    button, select { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 40px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--lime);
      color: #111608;
      box-shadow: 0 0 28px rgba(200, 255, 61, .2);
      transform: rotate(-3deg);
    }

    .brand-mark svg { width: 25px; height: 25px; }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
    .brand-name span { color: var(--lime); }
    .brand-sub { color: var(--muted); font: 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .18em; margin-top: 2px; }

    .top-actions { display: flex; gap: 10px; }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .035);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .icon-button:focus-visible, .primary-button:focus-visible, .pause-button:focus-visible, .speed-btn:focus-visible, .dpad button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .icon-button:hover { border-color: rgba(200, 255, 61, .35); background: var(--lime-soft); transform: translateY(-2px); }
    .icon-button svg { width: 18px; height: 18px; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 22px;
      align-items: stretch;
    }

    .game-card, .side-card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .3);
    }

    .game-card { border-radius: 30px; padding: 18px; }

    .game-header {
      padding: 7px 7px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow { color: var(--lime); font: 500 10px "DM Mono", monospace; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
    h1 { font-size: clamp(22px, 3vw, 32px); line-height: 1.08; letter-spacing: -.045em; }
    h1 span { color: var(--muted); font-weight: 500; }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: #aab0c2;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .live-dot { width: 7px; height: 7px; background: var(--lime); border-radius: 50%; box-shadow: 0 0 10px var(--lime); }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 20px;
      overflow: hidden;
      background: #090d17;
      border: 1px solid rgba(255, 255, 255, .07);
    }

    #gameCanvas { width: 100%; height: 100%; display: block; }

    .canvas-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, .5);
      border-radius: inherit;
    }

    .game-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(7, 10, 18, .72);
      backdrop-filter: blur(7px);
      z-index: 3;
      transition: opacity .25s ease;
    }

    .game-overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-content { text-align: center; padding: 30px; max-width: 390px; }

    .overlay-icon {
      width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 22px;
      display: grid; place-items: center; color: #0b1004; background: var(--lime);
      box-shadow: 0 0 40px rgba(200, 255, 61, .25); transform: rotate(-4deg);
    }
    .overlay-icon svg { width: 34px; height: 34px; }
    .overlay-content h2 { font-size: 27px; letter-spacing: -.04em; margin-bottom: 10px; }
    .overlay-content p { color: #989fb2; font-size: 13px; line-height: 1.7; margin-bottom: 22px; }

    .primary-button {
      border: 0;
      border-radius: 14px;
      padding: 13px 24px;
      background: var(--lime);
      color: #101407;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(200, 255, 61, .17);
      transition: .2s ease;
    }
    .primary-button:hover { transform: translateY(-2px); filter: brightness(1.05); }

    .game-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 7px 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .key-hints { display: flex; align-items: center; gap: 8px; }
    .key { min-width: 27px; height: 25px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line); background: rgba(255,255,255,.04); display: grid; place-items: center; color: #c2c6d2; font: 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .tip { display: flex; align-items: center; gap: 7px; }
    .tip svg { width: 15px; color: var(--lime); }

    .sidebar { display: flex; flex-direction: column; gap: 16px; }
    .side-card { border-radius: var(--radius); padding: 21px; }
    .section-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 14px; }

    .score-card {
      background:
        linear-gradient(145deg, rgba(200, 255, 61, .12), transparent 56%),
        var(--panel-solid);
      position: relative;
      overflow: hidden;
    }

    .score-card::after { content: ""; position: absolute; width: 115px; height: 115px; right: -35px; top: -42px; border: 25px solid rgba(200,255,61,.035); border-radius: 50%; }
    .score-row { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 18px; align-items: center; }
    .divider { height: 42px; background: var(--line); }
    .score-value { font: 500 34px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: -.05em; line-height: 1; }
    .score-value.accent { color: var(--lime); }
    .score-name { color: var(--muted); font-size: 11px; margin-top: 7px; }

    .control-card { flex: 1; }
    .setting { margin-bottom: 22px; }
    .setting:last-child { margin-bottom: 0; }
    .setting-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 700; }

    .speed-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .speed-btn { border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 10px; padding: 9px 4px; color: var(--muted); font-size: 11px; cursor: pointer; transition: .2s; }
    .speed-btn:hover { color: white; }
    .speed-btn.active { background: var(--lime-soft); border-color: rgba(200,255,61,.35); color: var(--lime); font-weight: 700; }

    .stat-line { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .stat-line:last-child { border: 0; padding-bottom: 0; }
    .stat-icon { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.045); color: var(--purple); }
    .stat-icon svg { width: 15px; height: 15px; }
    .stat-text { flex: 1; color: #a6acbc; font-size: 11px; }
    .stat-number { font: 500 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

    .pause-button {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 12px;
      background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center;
      gap: 9px; cursor: pointer; font-size: 12px; font-weight: 700; transition: .2s;
    }
    .pause-button:hover { background: rgba(255,255,255,.08); }
    .pause-button svg { width: 15px; }

    .mobile-controls { display: none; margin-top: 16px; justify-content: center; }
    .dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 7px; }
    .dpad button { border: 1px solid var(--line); background: var(--panel); border-radius: 13px; display: grid; place-items: center; }
    .dpad button:active { background: var(--lime-soft); color: var(--lime); }
    .dpad button svg { width: 18px; }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #eefbcf; color: #182006; padding: 10px 17px; border-radius: 999px; font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 20; transition: .25s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    @media (max-width: 900px) {
      .game-layout { grid-template-columns: 1fr; }
      .sidebar { display: grid; grid-template-columns: 1fr 1.35fr; }
      .control-card { grid-row: span 2; }
      .canvas-wrap { aspect-ratio: 3 / 2; }
    }

    @media (max-width: 620px) {
      .app-shell { width: min(100% - 22px, 500px); padding-top: 17px; }
      .brand-sub { display: none; }
      .game-card { padding: 10px; border-radius: 22px; }
      .game-header { padding: 9px 7px 14px; }
      .live-badge { display: none; }
      .canvas-wrap { aspect-ratio: 3 / 2; border-radius: 16px; }
      .sidebar { display: grid; grid-template-columns: 1fr; }
      .control-card { grid-row: auto; }
      .game-footer { justify-content: center; }
      .key-hints { display: none; }
      .mobile-controls { display: flex; }
      h1 { font-size: 21px; }
      .game-layout { gap: 14px; }
      .score-card, .control-card { padding: 18px; }
      .overlay-content { padding: 20px; }
      .overlay-icon { width: 58px; height: 58px; border-radius: 18px; margin-bottom: 15px; }
      .overlay-content h2 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h7a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5H9a3 3 0 0 0-3 3v2"/><circle cx="14" cy="8" r="1" fill="currentColor" stroke="none"/><path d="M5 20h2"/></svg>
        </div>
        <div>
          <div class="brand-name">NEON<span>SNAKE</span></div>
          <div class="brand-sub">ARCADE SYSTEM / 01</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="soundButton" aria-label="关闭声音" aria-pressed="false" title="关闭声音">
          <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="icon-button" id="restartTop" aria-label="重新开始" title="重新开始">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 1 0 .2 3"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
    </header>

    <div class="game-layout">
      <section class="game-card">
        <div class="game-header">
          <div>
            <div class="eyebrow">Endless mode</div>
            <h1>霓虹蛇域 <span>/ 无尽模式</span></h1>
          </div>
          <div class="live-badge"><span class="live-dot"></span><span id="statusText">READY</span></div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="gameCanvas" aria-label="贪食蛇游戏区域"></canvas>
          <div class="canvas-vignette"></div>
          <div class="game-overlay" id="gameOverlay">
            <div class="overlay-content">
              <div class="overlay-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h7a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5H9a3 3 0 0 0-3 3v2"/><circle cx="14" cy="8" r="1" fill="currentColor" stroke="none"/><path d="M5 20h2"/></svg>
              </div>
              <h2 id="overlayTitle">准备好刷新纪录了吗？</h2>
              <p id="overlayText">吞噬能量核心，避开边界与自己的身体。<br>使用方向键或 WASD 开始移动。</p>
              <button class="primary-button" id="startButton">开始游戏</button>
            </div>
          </div>
        </div>

        <div class="game-footer">
          <div class="key-hints"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span>或方向键控制</span></div>
          <div class="tip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 22h4M8.2 14.5A7 7 0 1 1 15.8 14.5c-.7.5-.8 1.1-.8 1.5H9c0-.4-.1-1-.8-1.5Z"/></svg>
            <span>按空格键暂停</span>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="side-card score-card">
          <div class="section-label">本局数据</div>
          <div class="score-row">
            <div><div class="score-value accent" id="scoreValue">000</div><div class="score-name">当前得分</div></div>
            <div class="divider"></div>
            <div><div class="score-value" id="bestValue">000</div><div class="score-name">历史最佳</div></div>
          </div>
        </section>

        <section class="side-card control-card">
          <div class="section-label">游戏控制</div>
          <div class="setting">
            <div class="setting-head"><span>移动速度</span><span id="speedLabel" style="color:var(--lime)">标准</span></div>
            <div class="speed-options">
              <button class="speed-btn" data-speed="150" data-label="悠闲" aria-pressed="false">悠闲</button>
              <button class="speed-btn active" data-speed="105" data-label="标准" aria-pressed="true">标准</button>
              <button class="speed-btn" data-speed="70" data-label="极速" aria-pressed="false">极速</button>
            </div>
          </div>
          <div class="setting">
            <div class="setting-head"><span>实时状态</span></div>
            <div class="stat-line">
              <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M12 3v18"/></svg></div>
              <span class="stat-text">蛇身长度</span><span class="stat-number" id="lengthValue">05</span>
            </div>
            <div class="stat-line">
              <div class="stat-icon" style="color:var(--coral)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div>
              <span class="stat-text">存活时间</span><span class="stat-number" id="timeValue">00:00</span>
            </div>
          </div>
          <button class="pause-button" id="pauseButton">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
            <span id="pauseText">暂停游戏</span><span class="key" style="margin-left:auto">SPACE</span>
          </button>
        </section>
      </aside>
    </div>

    <div class="mobile-controls" aria-label="触屏方向控制">
      <div class="dpad">
        <button class="up" data-direction="up" aria-label="向上"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="left" data-direction="left" aria-label="向左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="down" data-direction="down" aria-label="向下"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="right" data-direction="right" aria-label="向右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">新纪录！</div>

  <script src="/snake-core.js"></script>
  <script>
    if (!window.SnakeCore) {
      throw new Error('游戏核心模块加载失败，请刷新页面后重试。');
    }

    const SnakeCore = window.SnakeCore;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvasWrap');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startButton = document.getElementById('startButton');
    const pauseButton = document.getElementById('pauseButton');
    const pauseText = document.getElementById('pauseText');
    const statusText = document.getElementById('statusText');
    const scoreValue = document.getElementById('scoreValue');
    const bestValue = document.getElementById('bestValue');
    const lengthValue = document.getElementById('lengthValue');
    const timeValue = document.getElementById('timeValue');
    const speedLabel = document.getElementById('speedLabel');
    const soundButton = document.getElementById('soundButton');
    const toast = document.getElementById('toast');

    const COLS = 30;
    const ROWS = 20;
    let snake = [];
    let food = { x: 21, y: 10 };
    let direction = { x: 1, y: 0 };
    let queuedDirection = { x: 1, y: 0 };
    let turnQueued = false;
    let score = 0;
    let best = readBestScore();
    let gameState = 'ready';
    let tickRate = 105;
    let lastTick = 0;
    let animationId;
    let startTime = 0;
    let elapsedBeforePause = 0;
    let particles = [];
    let muted = false;
    let audioContext;

    function readBestScore() {
      try {
        const stored = Number(localStorage.getItem('neonSnakeBest'));
        return Number.isFinite(stored) && stored > 0 ? stored : 0;
      } catch (_) {
        return 0;
      }
    }

    function saveBestScore(value) {
      try {
        localStorage.setItem('neonSnakeBest', String(value));
      } catch (_) { /* Persistence is optional; gameplay remains available. */ }
    }

    function formatScore(value) { return String(value).padStart(3, '0'); }
    function updateStats() {
      scoreValue.textContent = formatScore(score);
      bestValue.textContent = formatScore(best);
      lengthValue.textContent = String(snake.length).padStart(2, '0');
    }

    function resetSnake() {
      snake = SnakeCore.createInitialSnake();
      direction = { x: 1, y: 0 };
      queuedDirection = { x: 1, y: 0 };
      turnQueued = false;
      score = 0;
      particles = [];
      food = randomFood();
      updateStats();
      timeValue.textContent = '00:00';
    }

    function randomFood() {
      return SnakeCore.randomFood(snake, COLS, ROWS) || { x: -1, y: -1 };
    }

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function roundedRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
    }

    function draw() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      const cellW = w / COLS;
      const cellH = h / ROWS;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#090d17';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(255,255,255,.035)';
      ctx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cellW, 0); ctx.lineTo(x * cellW, h); ctx.stroke(); }
      for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cellH); ctx.lineTo(w, y * cellH); ctx.stroke(); }

      const pulse = 1 + Math.sin(performance.now() / 170) * .08;
      const fx = (food.x + .5) * cellW;
      const fy = (food.y + .5) * cellH;
      const fr = Math.min(cellW, cellH) * .27 * pulse;
      ctx.save();
      ctx.shadowBlur = 26;
      ctx.shadowColor = '#ff6d75';
      ctx.fillStyle = '#ff6d75';
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(fx - fr * .28, fy - fr * .28, fr * .22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      snake.forEach((part, index) => {
        const gap = Math.max(2, Math.min(cellW, cellH) * .13);
        const x = part.x * cellW + gap / 2;
        const y = part.y * cellH + gap / 2;
        const sw = cellW - gap;
        const sh = cellH - gap;
        const progress = 1 - index / Math.max(snake.length, 1);
        ctx.save();
        ctx.shadowBlur = index < 4 ? 15 : 5;
        ctx.shadowColor = index === 0 ? '#c8ff3d' : 'rgba(165,108,255,.45)';
        ctx.fillStyle = index === 0 ? '#c8ff3d' : `hsl(${262 - progress * 22} 85% ${55 + progress * 8}%)`;
        roundedRect(x, y, sw, sh, Math.min(sw, sh) * (index === 0 ? .38 : .3));
        ctx.fill();
        ctx.restore();

        if (index === 0) {
          const eyeR = Math.max(1.3, Math.min(cellW, cellH) * .07);
          const centerX = (part.x + .5) * cellW;
          const centerY = (part.y + .5) * cellH;
          const perp = { x: -direction.y, y: direction.x };
          [-1, 1].forEach(side => {
            ctx.fillStyle = '#111608';
            ctx.beginPath();
            ctx.arc(centerX + direction.x * cellW * .19 + perp.x * side * cellW * .14, centerY + direction.y * cellH * .19 + perp.y * side * cellH * .14, eyeR, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      });

      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        p.x += p.vx; p.y += p.vy; p.life -= .025; p.size *= .98;
      });
      ctx.globalAlpha = 1;
      particles = particles.filter(p => p.life > 0);
    }

    function createParticles(gridX, gridY) {
      const cellW = wrap.clientWidth / COLS;
      const cellH = wrap.clientHeight / ROWS;
      for (let i = 0; i < 18; i++) {
        const angle = (Math.PI * 2 * i) / 18 + Math.random() * .25;
        const speed = .6 + Math.random() * 2.2;
        particles.push({ x: (gridX + .5) * cellW, y: (gridY + .5) * cellH, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, size: 1.5 + Math.random() * 2.5, color: i % 2 ? '#ff6d75' : '#c8ff3d' });
      }
    }

    function tick() {
      direction = queuedDirection;
      turnQueued = false;
      const move = SnakeCore.inspectMove(snake, direction, food, COLS, ROWS);
      if (move.collided) { endGame(); return; }

      snake.unshift(move.head);
      if (move.willEat) {
        createParticles(food.x, food.y);
        score += tickRate <= 75 ? 20 : tickRate >= 140 ? 5 : 10;
        if (score > best) {
          best = score;
          saveBestScore(best);
        }
        food = randomFood();
        playTone(520, .06);
        if (navigator.vibrate) navigator.vibrate(25);
      } else {
        snake.pop();
      }
      updateStats();
    }

    function gameLoop(timestamp) {
      if (gameState === 'playing' && timestamp - lastTick >= tickRate) {
        tick();
        lastTick = timestamp;
      }
      if (gameState === 'playing') {
        const seconds = Math.floor((elapsedBeforePause + performance.now() - startTime) / 1000);
        timeValue.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (gameState === 'ready' || gameState === 'over') resetSnake();
      gameState = 'playing';
      startTime = performance.now();
      elapsedBeforePause = 0;
      lastTick = performance.now();
      overlay.classList.add('hidden');
      statusText.textContent = 'RUNNING';
      pauseText.textContent = '暂停游戏';
      playTone(320, .08);
    }

    function togglePause() {
      if (gameState === 'playing') {
        elapsedBeforePause += performance.now() - startTime;
        gameState = 'paused';
        overlayTitle.textContent = '游戏已暂停';
        overlayText.innerHTML = '调整呼吸，观察路线。<br>准备好后继续你的霓虹旅程。';
        startButton.textContent = '继续游戏';
        overlay.classList.remove('hidden');
        statusText.textContent = 'PAUSED';
        pauseText.textContent = '继续游戏';
      } else if (gameState === 'paused') {
        gameState = 'playing';
        startTime = performance.now();
        lastTick = performance.now();
        overlay.classList.add('hidden');
        statusText.textContent = 'RUNNING';
        pauseText.textContent = '暂停游戏';
      }
    }

    function endGame() {
      gameState = 'over';
      playTone(140, .18);
      overlayTitle.textContent = '能量链路中断';
      overlayText.innerHTML = `本次获得 <strong style="color:#c8ff3d">${score}</strong> 分，蛇身长度达到 ${snake.length}。<br>换个节奏，再挑战一次吧。`;
      startButton.textContent = '再来一局';
      overlay.classList.remove('hidden');
      statusText.textContent = 'GAME OVER';
      if (score > 0 && score === best) showToast('新纪录已保存！');
    }

    function setDirection(x, y) {
      if (gameState === 'ready') startGame();
      if (gameState !== 'playing' || turnQueued) return;
      if (!SnakeCore.isDirectionAllowed(direction, { x, y })) return;
      queuedDirection = { x, y };
      turnQueued = true;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function playTone(frequency, duration) {
      if (muted) return;
      try {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine'; oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.05, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);
        oscillator.connect(gain); gain.connect(audioContext.destination);
        oscillator.start(); oscillator.stop(audioContext.currentTime + duration);
      } catch (_) { /* Audio is an enhancement; gameplay remains available. */ }
    }

    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(key)) event.preventDefault();
      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') setDirection(1, 0);
      if (key === ' ') togglePause();
    });

    document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('pointerdown', () => {
      const directions = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
      setDirection(...directions[button.dataset.direction]);
    }));

    document.querySelectorAll('.speed-btn').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.speed-btn').forEach(item => {
        item.classList.remove('active');
        item.setAttribute('aria-pressed', 'false');
      });
      button.classList.add('active');
      button.setAttribute('aria-pressed', 'true');
      tickRate = Number(button.dataset.speed);
      speedLabel.textContent = button.dataset.label;
      showToast(`速度已切换为${button.dataset.label}`);
    }));

    let touchStart = null;
    wrap.addEventListener('touchstart', event => { touchStart = event.touches[0]; }, { passive: true });
    wrap.addEventListener('touchend', event => {
      if (!touchStart) return;
      const end = event.changedTouches[0];
      const dx = end.clientX - touchStart.clientX;
      const dy = end.clientY - touchStart.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
        Math.abs(dx) > Math.abs(dy) ? setDirection(Math.sign(dx), 0) : setDirection(0, Math.sign(dy));
      }
      touchStart = null;
    }, { passive: true });

    startButton.addEventListener('click', () => gameState === 'paused' ? togglePause() : startGame());
    pauseButton.addEventListener('click', togglePause);
    document.getElementById('restartTop').addEventListener('click', () => {
      gameState = 'over'; startGame(); showToast('新游戏已开始');
    });
    soundButton.addEventListener('click', () => {
      muted = !muted;
      soundButton.style.color = muted ? '#7d8499' : '#c8ff3d';
      soundButton.setAttribute('aria-pressed', String(muted));
      soundButton.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
      soundButton.title = muted ? '开启声音' : '关闭声音';
      showToast(muted ? '声音已关闭' : '声音已开启');
      if (!muted) playTone(440, .06);
    });

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('visibilitychange', () => { if (document.hidden && gameState === 'playing') togglePause(); });

    bestValue.textContent = formatScore(best);
    resetSnake();
    resizeCanvas();
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
